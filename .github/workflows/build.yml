name: Build OVGME package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate OpenKneeboard pages
        shell: pwsh
        run: |
          npm ci
          npm run build:kneeboard
      - name: Build package
        shell: pwsh
        run: ./scripts/Build-OvGME.ps1
      - name: Validate package
        shell: pwsh
        run: ./scripts/Test-Package.ps1
      - name: Build complete release bundle
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: F-14BU-Release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish versioned GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = (Get-Content packaging/ovgme/VERSION.TXT -Raw).Trim()
          $Tag = "v$Version"
          $Title = "F-14B(U) Components $Version"
          $Assets = Get-ChildItem dist/*.zip, dist/SHA256SUMS.txt | ForEach-Object FullName

          gh release view $Tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $Tag $Assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $Tag --title $Title --notes-file packaging/release/RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $Tag $Assets --target $env:GITHUB_SHA --title $Title --notes-file packaging/release/RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY
          }
